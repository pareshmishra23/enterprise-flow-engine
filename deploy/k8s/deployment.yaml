apiVersion: apps/v1
kind: Deployment
metadata:
  name: efe-platform
  namespace: default
  labels:
    app: efe-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: efe-platform
  template:
    metadata:
      labels:
        app: efe-platform
    spec:
      containers:
        - name: efe-module
          image: efe-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: efe-config
