# NOTE (EFE-011): This is an EXAMPLE / REFERENCE deployment for the reconciliation-example
# application only. It proves an EFE Platform consumer can be containerized and deployed
# independently. It is NOT a production CA / Reconciliation / Electives deployment — those are
# separate future autonomous applications and their production hardening remains out of scope.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efe-reconciliation
  namespace: default
  labels:
    app: efe-reconciliation
    efe.example: "true"
    efe.type: reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: efe-reconciliation
  template:
    metadata:
      labels:
        app: efe-reconciliation
    spec:
      containers:
        - name: efe-reconciliation
          image: efe-reconciliation:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
