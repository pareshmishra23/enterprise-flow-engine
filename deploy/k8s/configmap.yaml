apiVersion: v1
kind: ConfigMap
metadata:
  name: efe-config
  namespace: default
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: trade-recon-esb-module
      jmx:
        enabled: true
    esb:
      module-name: trade-recon-esb
    messaging:
      provider: inmemory
    persistence:
      provider: inmemory
    efe:
      execution:
        workers:
          core-size: 4
          max-size: 10
          queue-capacity: 100
      intelligence:
        enabled: false
